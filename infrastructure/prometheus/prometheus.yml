global:
  scrape_interval: 10s
scrape_configs:
  - job_name: workflow-api
    metrics_path: /actuator/prometheus
    http_headers:
      X-API-Key:
        files: [/tmp/api-key]
    static_configs:
      - targets: [workflow-api:8080]
  - job_name: workflow-orchestrator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [workflow-orchestrator:8081]
  - job_name: workers
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [workflow-worker-java:8082, workflow-worker-kotlin:8083]
