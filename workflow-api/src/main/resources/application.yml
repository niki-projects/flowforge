spring:
  application:
    name: workflow-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/flowforge}
    username: ${DATABASE_USER:flowforge}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      timeout: 200ms
      connect-timeout: 200ms
server:
  port: 8080
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 256KB
    connection-timeout: 10s
    threads:
      max: 100
  shutdown: graceful
flowforge:
  api-key: ${FLOWFORGE_API_KEY}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  health:
    redis:
      enabled: false
logging:
  structured:
    json:
      add:
        service: ${spring.application.name}
    format:
      console: logstash
