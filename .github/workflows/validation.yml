name: Validate FlowForge
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile and run unit tests
        run: bash gradlew build
      - name: Testcontainers integration and end-to-end tests
        run: bash gradlew integrationTest
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            workflow-api/build/integration-logs/**
          retention-days: 7
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Build all service images
        run: docker compose build
      - name: Start full stack and verify sample workflow
        run: |
          docker compose up -d --wait --wait-timeout 180
          bash scripts/demo.sh
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v
